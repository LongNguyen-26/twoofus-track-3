### submit_031 — control: submit_020's config, unchanged, on the stock image.
###
### Opening anchor for the 26/07 batch. Today's three treatments all run from a
### custom image, so the day needs controls on both ends: without them a result
### cannot be separated from harness drift, and drift is large here — the same
### bytes have scored 63.08 (18/07), 59.15 (22/07), 61.68 and 60.51 (25/07).
###
### Also noise sample #9 for the pooled 020-equivalent set (mean 61.8, sd 1.2),
### and a free lottery ticket: the leaderboard keeps the best submission.
###
### Submit this FIRST, before any custom-image slot.
services:
  model:
    image: vllm/vllm-openai:v0.25.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
