### submit_037 — control for the 27/07 batch. Byte-identical to submit_031/035.
###
### The day's anchor. The v0.25.1 control baseline now has six measurements —
### TPOT 4.07, 4.01, 4.28, 4.14, 4.25, 4.09 → mean 4.140, sd 0.106 — which is
### tight enough that submit_036 landing near 3.55 ms would be unmistakable.
### This adds a seventh point taken on the same day and the same harness build
### as 036, which is what turns "3.55 is below the mean" into "3.55 is below the
### mean measured hours earlier on this exact harness".
###
### It matters more than usual right now: `config_hash` has disappeared from the
### result page, and every previous harness change moved scores.
###
### Submit AFTER submit_036 — the lever is worth more than the anchor if the day
### runs short.
services:
  model:
    image: vllm/vllm-openai:v0.25.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
