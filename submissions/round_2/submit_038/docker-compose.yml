### submit_038 — replicate submit_036. Byte-identical image and flags.
###
### Two jobs. First, TPOT is the stable statistic (sd 0.106 across six control
### runs) but a single measurement of a new configuration is still a single
### measurement; two readings either side of a control is what makes a claimed
### -0.5 ms real. Second, the leaderboard keeps the maximum, so a rerun of the
### best config is a free lottery ticket on TTFT, which is the noisy term.
###
### If submit_036's log showed "REJECTED by self-test" instead of "ACTIVE", do
### NOT submit this — fix the gate first, because both runs would just be
### expensive controls.
services:
  model:
    image: nguyenlong26/lfm25-custom-serve:v3-0251-fp8all
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
